terrain_assumptions:
- Only the four user-confirmed normal access routes can cross elevated ledges.
- Flying ramps require jumping and are not enabled by the planar follower.
- All interior contours, road widths and module footprints remain illustrative; game
  geometry is not certified.
- Slope footprints follow user image 1/3 diagonal road edge and image 2/4 arrow-level
  small ramp, with 180-degree counterparts. Gate masks are navigation topology only,
  never painted as slope footprints.
- The two small slopes each have an upper and lower pit; only the middle slope is
  traversable. Physical slope footprints replace automatic diagonal ledges, without
  erasing explicit pits or structures.
- The upper-right slope ends flush at the horizontal road edge, with no grey apron
  below. The lower-left slope has the mirrored cutoff. Automatic ledge raster opening
  thickness never extends the displayed physical slope.
- User-marked horizontal end lines on upper-right/lower-left slopes are explicit occupied
  barriers. Only the side opening between end barriers remains available; the planar
  planner must not cross either end line.
- The two small side highlands are user-confirmed climbable, shown grey with free
  occupancy; they are distinct from the blocked bases and central highland cliff gates.
- Campus screenshot controls layout, not the different 2026 field module layout. Public
  world-coordinate landmark checks constrain the nominal rule-size projection; they
  do not certify every contour.

